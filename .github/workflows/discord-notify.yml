name: Discord Notify

on:
  push:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        uses: actions/github-script@v8
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FLTU_DISCORD_WEBHOOK_URL: ${{ secrets.FLTU_DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const webhooks = [
              (process.env.DISCORD_WEBHOOK_URL || '').trim(),
              (process.env.FLTU_DISCORD_WEBHOOK_URL || '').trim()
            ].filter(Boolean);
            if (webhooks.length === 0) {
              core.setFailed('No Discord webhook URLs configured.');
              return;
            }

            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const repoUrl = `https://github.com/${repo}`;
            const eventName = context.eventName;
            const owner = context.repo.owner;
            let embed = null;

            if (eventName === 'push') {
              const ref = context.ref.startsWith('refs/heads/')
                ? context.ref.replace('refs/heads/', '')
                : context.ref.replace('refs/tags/', 'tag ');
              const commits = (context.payload.commits || []).slice(-5);
              const commitLines = commits.map((commit) => {
                const title = (commit.message || '').split('\n')[0] || '(no message)';
                const shortSha = (commit.id || '').slice(0, 7);
                return `[\`${shortSha}\`](${commit.url}) ${title}`;
              });

              embed = {
                author: {
                  name: owner,
                  url: repoUrl
                },
                title: `Push to ${ref}`,
                url: context.payload.compare || repoUrl,
                color: 0x5865F2,
                description: commitLines.join('\n') || 'No commit details were included in the payload.',
                footer: {
                  text: repo
                },
                timestamp: new Date().toISOString()
              };
            } else if (eventName === 'release') {
              const release = context.payload.release;
              // Link the Windows setup, not just the first asset (by name
              // that would be the Android APK); the APK gets its own line.
              const assets = release.assets || [];
              const setup = assets.find((asset) => asset.name.endsWith('-windows-setup.exe'));
              const apk = assets.find((asset) => asset.name.endsWith('-android.apk'));
              const downloadUrl = setup?.browser_download_url || release.html_url;
              const descriptionLines = [
                `\`${release.tag_name}\` is now available.`,
                '',
                `[Download from GitHub](${downloadUrl})`
              ];
              if (apk) {
                descriptionLines.push(`[Android APK](${apk.browser_download_url})`);
              }

              embed = {
                author: {
                  name: owner,
                  url: repoUrl
                },
                title: `Release: ${release.name || release.tag_name}`,
                url: release.html_url,
                color: 0x57F287,
                description: descriptionLines.join('\n'),
                footer: {
                  text: repo
                },
                timestamp: release.published_at || new Date().toISOString()
              };
            } else {
              embed = {
                author: {
                  name: owner,
                  url: repoUrl
                },
                title: eventName.replace(/_/g, ' '),
                url: `https://github.com/${repo}/actions/runs/${context.runId}`,
                color: 0xFEE75C,
                description: `GitHub Actions event for \`${repo}\`.`,
                footer: {
                  text: repo
                },
                timestamp: new Date().toISOString()
              };
            }

            const payload = JSON.stringify({
              embeds: [embed]
            });

            for (const webhook of webhooks) {
              const response = await fetch(webhook, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: payload
              });

              if (!response.ok) {
                const body = await response.text();
                core.warning(`Discord webhook failed (${response.status}): ${body}`);
              }
            }
