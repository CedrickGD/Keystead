name: Build & Release

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Check extension scripts
        run: for f in $(find extension/chrome -name '*.js'); do node --check "$f"; done

  windows:
    name: Windows build
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}".Substring(1)
          } else {
            $version = "2.0.0-beta.${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop app (exe + installer)
        working-directory: apps/desktop
        run: npx tauri build

      - name: Build terminal binary
        run: cargo build --release -p keystead-tui

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $out = "release"
          $portable = Join-Path $out "Keystead-$version-windows-portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item target/release/Keystead.exe $portable
          Copy-Item target/release/keystead-cli.exe $portable
          Copy-Item -Recurse extension/chrome (Join-Path $portable "browser-extension")
          Copy-Item docs/LIESMICH.txt $portable
          Copy-Item LICENSE $portable
          Compress-Archive -Path "$portable/*" -DestinationPath (Join-Path $out "Keystead-$version-windows-portable.zip")
          Compress-Archive -Path "extension/chrome/*" -DestinationPath (Join-Path $out "Keystead-$version-browser-extension.zip")
          $setup = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if ($setup) { Copy-Item $setup.FullName (Join-Path $out "Keystead-$version-windows-setup.exe") }
          Get-ChildItem $out

      - uses: actions/upload-artifact@v4
        with:
          name: Keystead-${{ steps.version.outputs.version }}-windows
          path: |
            release/*.zip
            release/*.exe
          if-no-files-found: error

  release:
    name: Publish pre-release
    needs: [test, windows]
    # Tags publish a release; on branches a commit message containing [release] publishes a beta.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Keystead-${{ needs.windows.outputs.version }}-windows
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Keystead ${{ needs.windows.outputs.version }}
          # Pre-release: the old VaultX 1.x auto-update only follows "latest" and must not jump to Keystead betas.
          prerelease: true
          generate_release_notes: false
          body: |
            **Keystead – Testversion (Beta)**

            Keystead ist der Nachfolger von VaultX 1.x – alte VaultX-Tresore lassen sich beim Einrichten importieren.

            * `Keystead-…-windows-portable.zip` – entpacken und `Keystead.exe` starten (keine Installation nötig). Enthält auch die Terminal-Version `keystead-cli.exe` und den Ordner `browser-extension`.
            * `Keystead-…-windows-setup.exe` – klassischer Installer (optional).
            * `Keystead-…-browser-extension.zip` – Browser-Erweiterung für Chrome/Edge/Brave.

            Die EXE ist nicht signiert: Windows SmartScreen zeigt beim ersten Start evtl. „Der Computer wurde durch Windows geschützt“ → „Weitere Informationen“ → „Trotzdem ausführen“.
            Anleitung: siehe `LIESMICH.txt` im ZIP.
          files: release/*
