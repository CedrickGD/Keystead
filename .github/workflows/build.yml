name: Build & Release

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # SHA-256 of the Android release signing certificate (the keystore lives
  # in the private repo CedrickGD/keys, folder keystead/; README.md
  # publishes the same value). A publishing build whose APK carries another
  # certificate fails – such an APK could never update an installed app.
  ANDROID_RELEASE_CERT_SHA256: "B7:3D:75:D6:F7:F4:60:5B:0B:4A:7A:3A:8E:00:6E:E8:E3:D0:81:F1:C3:37:85:BC:79:98:A8:8F:02:1F:3C:AA"

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # Third-party actions are pinned to full commit SHAs (a tag or branch can
      # be moved); the toolchain matches rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Check extension and release scripts
        run: |
          for f in $(find extension/chrome .github/scripts -name '*.js' -o -name '*.mjs'); do node --check "$f"; done
          node --test extension/tests/*.test.mjs .github/scripts/*.test.mjs apps/desktop/tests/*.test.mjs

  windows:
    name: Windows build
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      extension_version: ${{ steps.version.outputs.extension_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # Every build gets its own version (the updater compares semver):
      # tags v<semver> → that version, everything else → <tauri.conf.json
      # version>-beta.<run number>. Written into tauri.conf.json (app, NSIS
      # setup, updater) and the extension manifest (<x.y.z>.<run number>)
      # before anything is built – the app embeds the extension.
      # --check-tags: after a release vX.Y.Z, tauri.conf.json must name the next
      # version, otherwise X.Y.Z-beta.<run> sorts below vX.Y.Z and is never
      # offered by the updater – a warning, and an error for builds that publish.
      - name: Determine and set version
        id: version
        env:
          KEYSTEAD_PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) }}
        run: node .github/scripts/release-version.mjs --write --check-tags

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # The NSIS setup is signed for the in-app updater (`<setup>.exe.sig`)
      # with the minisign key in the TAURI_SIGNING_PRIVATE_KEY secret – only
      # on builds that publish (tags v*, pushes with [release]; the same
      # condition as the release job). Every other build (branch pushes, pull
      # requests, workflow_dispatch) never gets the secret and produces no
      # .sig / latest.json, so no unreviewed build is a valid update.
      - name: Build desktop app (exe + installer)
        working-directory: apps/desktop
        shell: pwsh
        env:
          KEYSTEAD_VERSION_LABEL: ${{ steps.version.outputs.version }}
          KEYSTEAD_PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))) && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          $publish = $env:KEYSTEAD_PUBLISH -eq 'true'
          if (-not $publish -or [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            if ($publish) {
              Write-Host "::warning title=Updates not signed::The secret TAURI_SIGNING_PRIVATE_KEY is not set: building without updater artifacts (no .sig, no latest.json). Installed copies cannot update to this build in-app."
            } else {
              Write-Host "Not a publishing build: building without updater artifacts (no .sig, no latest.json)."
            }
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            $override = Join-Path $env:RUNNER_TEMP "no-updater-artifacts.json"
            '{ "bundle": { "createUpdaterArtifacts": false } }' | Set-Content -Path $override -Encoding utf8
            npx tauri build --config $override
          } else {
            npx tauri build
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build terminal binary
        run: cargo build --release -p keystead-tui

      - name: Package
        shell: pwsh
        env:
          # The commit subject becomes the release notes in latest.json
          # (passed as data, never interpolated into the script).
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $out = "release"
          $portable = Join-Path $out "Keystead-$version-windows-portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item target/release/Keystead.exe $portable
          Copy-Item target/release/keystead-cli.exe $portable
          Copy-Item -Recurse extension/chrome (Join-Path $portable "browser-extension")
          Copy-Item docs/LIESMICH.txt $portable
          Copy-Item LICENSE $portable
          Compress-Archive -Path "$portable/*" -DestinationPath (Join-Path $out "Keystead-$version-windows-portable.zip")
          Compress-Archive -Path "extension/chrome/*" -DestinationPath (Join-Path $out "Keystead-$version-browser-extension.zip")

          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "NSIS setup missing" }
          # The asset name the release uploads – latest.json must point at exactly this name.
          $setupName = "Keystead-$version-windows-setup.exe"
          Copy-Item $setup.FullName (Join-Path $out $setupName)
          $sig = "$($setup.FullName).sig"
          if (Test-Path $sig) {
            Copy-Item $sig (Join-Path $out "$setupName.sig")
            node .github/scripts/latest-json.mjs `
              --version $version `
              --signature-file $sig `
              --url "https://github.com/${{ github.repository }}/releases/download/v$version/$setupName" `
              --out (Join-Path $out "latest.json")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "No updater signature – no latest.json for $version."
          }
          Get-ChildItem $out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Keystead-${{ steps.version.outputs.version }}-windows
          path: |
            release/*.zip
            release/*.exe
            release/*.sig
            release/latest.json
          if-no-files-found: error

  # The phone app ("Mobile (Android)" in docs/ARCHITECTURE.md): one arm64
  # APK, built on every push and pull request like the Windows build. Only
  # builds that publish (the release job's condition) get the release
  # keystore from the secrets; every other APK is signed with the runner's
  # debug key – it installs, but can never update a release-signed app – and
  # stays a workflow artifact.
  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      KEYSTEAD_PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) }}
      # What the committed project (gen/android) builds with: the NDK the
      # Rust targets link against (r28: 16 KB pages by default), the
      # platform of compileSdk 37 and the build-tools of the gates below.
      ANDROID_NDK_VERSION: 28.2.13676358
      ANDROID_PLATFORM: android-37.0
      ANDROID_BUILD_TOOLS: 36.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # The same version as the windows job (same script, same run number):
      # tauri.conf.json `version` becomes the APK's versionName, and the run
      # number its versionCode (`bundle.android.versionCode` in
      # tauri.android.conf.json) – run numbers only grow, so every APK is an
      # update for the ones before it. Never rename this workflow file: that
      # restarts the run number and installed apps refuse every later APK.
      - name: Determine and set version
        id: version
        run: node .github/scripts/release-version.mjs --write

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            apps/desktop/src-tauri/gen/android/*.gradle*
            apps/desktop/src-tauri/gen/android/app/*.gradle*
            apps/desktop/src-tauri/gen/android/buildSrc/*.gradle*
            apps/desktop/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties

      # The runner image ships the Android SDK (ANDROID_HOME); anything of
      # the above it lacks is installed here.
      - name: Android SDK packages
        run: |
          missing=()
          [ -f "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/source.properties" ] || missing+=("ndk;$ANDROID_NDK_VERSION")
          [ -f "$ANDROID_HOME/platforms/$ANDROID_PLATFORM/android.jar" ] || missing+=("platforms;$ANDROID_PLATFORM")
          [ -x "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/zipalign" ] || missing+=("build-tools;$ANDROID_BUILD_TOOLS")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Installing ${missing[*]}"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "${missing[@]}" > /dev/null
          fi
          test -f "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/source.properties"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10
        with:
          toolchain: 1.97.0
          targets: aarch64-linux-android,x86_64-linux-android
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android

      - name: Build frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      # The test job compiles the desktop side only; this lints the
      # cfg(mobile) code paths of the core and the app crate (their tests
      # are desktop-only, hence no --all-targets).
      - name: Clippy (Android)
        run: |
          bin="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android29-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo clippy -p keystead-core -p keystead-desktop --target aarch64-linux-android -- -D warnings

      # Like TAURI_SIGNING_PRIVATE_KEY in the windows job: the secrets reach
      # only builds that publish. The keystore lands outside the repository
      # (gen/android/keystore.properties points at it; both are removed
      # after the build). A missing secret fails the build – a published APK
      # must never be debug-signed.
      - name: Release signing key
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: node .github/scripts/android-apk.mjs keystore --keystore "$RUNNER_TEMP/keystead-android-release.jks" --properties apps/desktop/src-tauri/gen/android/keystore.properties

      # KEYSTEAD_VERSION_LABEL is read at compile time (About page).
      - name: Build Android app (APK, arm64)
        working-directory: apps/desktop
        env:
          KEYSTEAD_VERSION_LABEL: ${{ steps.version.outputs.version }}
        run: npx tauri android build --apk --target aarch64 --ci

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/keystead-android-release.jks" apps/desktop/src-tauri/gen/android/keystore.properties

      # Gates (.github/scripts/android-apk.mjs): valid signature – on
      # publishing builds exactly the release certificate –, 16 KB page
      # alignment, package, versionName/versionCode, minSdk 29, no INTERNET
      # permission, not debuggable, arm64 code.
      - name: Check and package the APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.android_version_code }}
        run: |
          mkdir -p release
          apk="release/Keystead-$VERSION-android.apk"
          cp apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$apk"
          args=(verify --apk "$apk" --build-tools "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
            --version-name "$VERSION" --version-code "$VERSION_CODE" --abi arm64-v8a)
          if [ "$KEYSTEAD_PUBLISH" = "true" ]; then
            args+=(--signer "$ANDROID_RELEASE_CERT_SHA256")
          fi
          node .github/scripts/android-apk.mjs "${args[@]}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Keystead-${{ steps.version.outputs.version }}-android
          path: release/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [test, windows, android]
    # Tags publish a release; on branches a commit message containing [release] publishes a beta.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.windows.outputs.version }}
      ANDROID_VERSION: ${{ needs.android.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Keystead-${{ needs.windows.outputs.version }}-windows
          path: release

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Keystead-${{ needs.android.outputs.version }}-android
          path: release

      # Pre-releases (every version with a "-…" suffix) are never GitHub's
      # "latest" release: VaultX 1.x updates itself from "latest" and must not
      # jump to Keystead betas. Only a stable tag (v2.0.0) becomes "latest".
      - name: Release type and notes
        id: meta
        run: |
          node .github/scripts/semver.mjs valid "$VERSION"
          # Both jobs compute the version with the same script; the APK's
          # versionName must name the release it is attached to.
          if [ "$ANDROID_VERSION" != "$VERSION" ]; then
            echo "::error::Windows build $VERSION and Android build $ANDROID_VERSION differ"
            exit 1
          fi
          test -f "release/Keystead-$VERSION-android.apk"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            title="Keystead – Testversion (Beta)"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            title="Keystead $VERSION"
          fi
          {
            echo "**$title**"
            echo
            echo "Keystead ist der Nachfolger von VaultX 1.x – alte VaultX-Tresore lassen sich beim Einrichten importieren."
            echo
            echo "* \`Keystead-…-windows-setup.exe\` – Installer. Installierte Versionen aktualisieren sich danach selbst (Einstellungen → Über Keystead)."
            echo "* \`Keystead-…-windows-portable.zip\` – entpacken und \`Keystead.exe\` starten (keine Installation nötig). Enthält auch die Terminal-Version \`keystead-cli.exe\` und den Ordner \`browser-extension\`. Die ZIP-Version meldet neue Versionen, aktualisiert sich aber nicht selbst."
            echo "* \`Keystead-…-browser-extension.zip\` – Browser-Erweiterung für Chrome/Edge/Brave. Die App legt sie auch selbst in ihrem Datenordner ab (\`browser-extension\`) und hält sie dort aktuell."
            echo "* \`Keystead-…-android.apk\` – Android-App (ab Android 10), **frühe Vorschau**: nur lesen, ohne Internetzugriff, Entsperren auch per Fingerabdruck; die Tresore holt sie aus einem Ordner deiner eigenen Cloud (Nextcloud- oder OneDrive-App), einen Tresor anlegen kann sie nicht. Am PC legt die Einstellung „Kopie im Cloud-Ordner aktuell halten“ (Einstellungen → Handy) deine Tresore verschlüsselt in diesen Ordner (siehe README). Auf dem Handy herunterladen und öffnen; beim ersten Mal fragt Android, ob der Browser bzw. die Dateien-App unbekannte Apps installieren darf – zulassen. Eine neuere APK installierst du einfach über die alte (die Daten bleiben). Signaturzertifikat (SHA-256): \`$ANDROID_RELEASE_CERT_SHA256\`."
            echo "* \`latest.json\`, \`*.sig\` – technische Dateien für die Updates in der App (signiert)."
            echo
            echo "Die EXE ist nicht mit einem Windows-Zertifikat signiert: Windows SmartScreen zeigt beim ersten Start evtl. „Der Computer wurde durch Windows geschützt“ → „Weitere Informationen“ → „Trotzdem ausführen“."
            echo "Anleitung: siehe \`LIESMICH.txt\` im ZIP."
          } > release-notes.md
          if [ -f release/latest.json ]; then
            echo "updater=true" >> "$GITHUB_OUTPUT"
          else
            echo "updater=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No in-app update::This release has no latest.json (TAURI_SIGNING_PRIVATE_KEY was not set for the build)."
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Keystead ${{ needs.windows.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          generate_release_notes: false
          body_path: release-notes.md
          files: release/*

      # The beta channel's manifest lives in a fixed pre-release (tag
      # `updater-beta`): the app reads
      # …/releases/download/updater-beta/latest.json. Every published build
      # (betas and stable releases) moves it forward – never backwards.
      - name: Update the beta update channel
        if: steps.meta.outputs.updater == 'true'
        run: |
          body="Technische Release für die In-App-Updates von Keystead (Beta-Kanal). Enthält nur \`latest.json\` mit der neuesten Version; die App lädt daraus das signierte Setup der jeweiligen Version. Bitte nicht löschen – Downloads gibt es bei den versionierten Releases."
          if ! gh release view updater-beta > /dev/null 2>&1; then
            gh release create updater-beta --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Keystead Updater (Beta-Kanal)" --notes "$body"
          fi
          gh release edit updater-beta --prerelease --latest=false \
            --title "Keystead Updater (Beta-Kanal)" --notes "$body"
          current=""
          if gh release download updater-beta --pattern latest.json --dir channel --clobber 2> /dev/null; then
            current=$(node -e 'const fs=require("fs");try{const v=JSON.parse(fs.readFileSync("channel/latest.json","utf8")).version;if(typeof v==="string")process.stdout.write(v)}catch{}')
          fi
          if [ -n "$current" ] && node .github/scripts/semver.mjs valid "$current" && ! node .github/scripts/semver.mjs newer "$VERSION" "$current"; then
            echo "Beta channel already offers $current (not older than $VERSION) – left unchanged."
          else
            gh release upload updater-beta release/latest.json --clobber
            echo "Beta channel now offers $VERSION (was: ${current:-none})."
          fi
