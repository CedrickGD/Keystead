name: Build & Release

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Check extension and release scripts
        run: |
          for f in $(find extension/chrome .github/scripts -name '*.js' -o -name '*.mjs'); do node --check "$f"; done
          node --test extension/tests/*.test.mjs .github/scripts/*.test.mjs

  windows:
    name: Windows build
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      extension_version: ${{ steps.version.outputs.extension_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # Every build gets its own version (the updater compares semver):
      # tags v<semver> → that version, everything else → <tauri.conf.json
      # version>-beta.<run number>. Written into tauri.conf.json (app, NSIS
      # setup, updater) and the extension manifest (<x.y.z>.<run number>)
      # before anything is built – the app embeds the extension.
      # --check-tags: after a release vX.Y.Z, tauri.conf.json must name the next
      # version, otherwise X.Y.Z-beta.<run> sorts below vX.Y.Z and is never
      # offered by the updater – a warning, and an error for builds that publish.
      - name: Determine and set version
        id: version
        env:
          KEYSTEAD_PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) }}
        run: node .github/scripts/release-version.mjs --write --check-tags

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # The NSIS setup is signed for the in-app updater (`<setup>.exe.sig`)
      # with the minisign key in the TAURI_SIGNING_PRIVATE_KEY secret. Without
      # the secret the build still succeeds, just without updater artifacts.
      - name: Build desktop app (exe + installer)
        working-directory: apps/desktop
        shell: pwsh
        env:
          KEYSTEAD_VERSION_LABEL: ${{ steps.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Host "::warning title=Updates not signed::The secret TAURI_SIGNING_PRIVATE_KEY is not set: building without updater artifacts (no .sig, no latest.json). Installed copies cannot update to this build in-app."
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            $override = Join-Path $env:RUNNER_TEMP "no-updater-artifacts.json"
            '{ "bundle": { "createUpdaterArtifacts": false } }' | Set-Content -Path $override -Encoding utf8
            npx tauri build --config $override
          } else {
            npx tauri build
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build terminal binary
        run: cargo build --release -p keystead-tui

      - name: Package
        shell: pwsh
        env:
          # The commit subject becomes the release notes in latest.json
          # (passed as data, never interpolated into the script).
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $out = "release"
          $portable = Join-Path $out "Keystead-$version-windows-portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item target/release/Keystead.exe $portable
          Copy-Item target/release/keystead-cli.exe $portable
          Copy-Item -Recurse extension/chrome (Join-Path $portable "browser-extension")
          Copy-Item docs/LIESMICH.txt $portable
          Copy-Item LICENSE $portable
          Compress-Archive -Path "$portable/*" -DestinationPath (Join-Path $out "Keystead-$version-windows-portable.zip")
          Compress-Archive -Path "extension/chrome/*" -DestinationPath (Join-Path $out "Keystead-$version-browser-extension.zip")

          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "NSIS setup missing" }
          # The asset name the release uploads – latest.json must point at exactly this name.
          $setupName = "Keystead-$version-windows-setup.exe"
          Copy-Item $setup.FullName (Join-Path $out $setupName)
          $sig = "$($setup.FullName).sig"
          if (Test-Path $sig) {
            Copy-Item $sig (Join-Path $out "$setupName.sig")
            node .github/scripts/latest-json.mjs `
              --version $version `
              --signature-file $sig `
              --url "https://github.com/${{ github.repository }}/releases/download/v$version/$setupName" `
              --out (Join-Path $out "latest.json")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "No updater signature – no latest.json for $version."
          }
          Get-ChildItem $out

      - uses: actions/upload-artifact@v4
        with:
          name: Keystead-${{ steps.version.outputs.version }}-windows
          path: |
            release/*.zip
            release/*.exe
            release/*.sig
            release/latest.json
          if-no-files-found: error

  release:
    name: Publish release
    needs: [test, windows]
    # Tags publish a release; on branches a commit message containing [release] publishes a beta.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.windows.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v4
        with:
          name: Keystead-${{ needs.windows.outputs.version }}-windows
          path: release

      # Pre-releases (every version with a "-…" suffix) are never GitHub's
      # "latest" release: VaultX 1.x updates itself from "latest" and must not
      # jump to Keystead betas. Only a stable tag (v2.0.0) becomes "latest".
      - name: Release type and notes
        id: meta
        run: |
          node .github/scripts/semver.mjs valid "$VERSION"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            title="Keystead – Testversion (Beta)"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            title="Keystead $VERSION"
          fi
          {
            echo "**$title**"
            echo
            echo "Keystead ist der Nachfolger von VaultX 1.x – alte VaultX-Tresore lassen sich beim Einrichten importieren."
            echo
            echo "* \`Keystead-…-windows-setup.exe\` – Installer. Installierte Versionen aktualisieren sich danach selbst (Einstellungen → Über Keystead)."
            echo "* \`Keystead-…-windows-portable.zip\` – entpacken und \`Keystead.exe\` starten (keine Installation nötig). Enthält auch die Terminal-Version \`keystead-cli.exe\` und den Ordner \`browser-extension\`. Die ZIP-Version meldet neue Versionen, aktualisiert sich aber nicht selbst."
            echo "* \`Keystead-…-browser-extension.zip\` – Browser-Erweiterung für Chrome/Edge/Brave. Die App legt sie auch selbst in ihrem Datenordner ab (\`browser-extension\`) und hält sie dort aktuell."
            echo "* \`latest.json\`, \`*.sig\` – technische Dateien für die Updates in der App (signiert)."
            echo
            echo "Die EXE ist nicht mit einem Windows-Zertifikat signiert: Windows SmartScreen zeigt beim ersten Start evtl. „Der Computer wurde durch Windows geschützt“ → „Weitere Informationen“ → „Trotzdem ausführen“."
            echo "Anleitung: siehe \`LIESMICH.txt\` im ZIP."
          } > release-notes.md
          if [ -f release/latest.json ]; then
            echo "updater=true" >> "$GITHUB_OUTPUT"
          else
            echo "updater=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No in-app update::This release has no latest.json (TAURI_SIGNING_PRIVATE_KEY was not set for the build)."
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Keystead ${{ needs.windows.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          generate_release_notes: false
          body_path: release-notes.md
          files: release/*

      # The beta channel's manifest lives in a fixed pre-release (tag
      # `updater-beta`): the app reads
      # …/releases/download/updater-beta/latest.json. Every published build
      # (betas and stable releases) moves it forward – never backwards.
      - name: Update the beta update channel
        if: steps.meta.outputs.updater == 'true'
        run: |
          body="Technische Release für die In-App-Updates von Keystead (Beta-Kanal). Enthält nur \`latest.json\` mit der neuesten Version; die App lädt daraus das signierte Setup der jeweiligen Version. Bitte nicht löschen – Downloads gibt es bei den versionierten Releases."
          if ! gh release view updater-beta > /dev/null 2>&1; then
            gh release create updater-beta --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Keystead Updater (Beta-Kanal)" --notes "$body"
          fi
          gh release edit updater-beta --prerelease --latest=false \
            --title "Keystead Updater (Beta-Kanal)" --notes "$body"
          current=""
          if gh release download updater-beta --pattern latest.json --dir channel --clobber 2> /dev/null; then
            current=$(node -e 'const fs=require("fs");try{const v=JSON.parse(fs.readFileSync("channel/latest.json","utf8")).version;if(typeof v==="string")process.stdout.write(v)}catch{}')
          fi
          if [ -n "$current" ] && node .github/scripts/semver.mjs valid "$current" && ! node .github/scripts/semver.mjs newer "$VERSION" "$current"; then
            echo "Beta channel already offers $current (not older than $VERSION) – left unchanged."
          else
            gh release upload updater-beta release/latest.json --clobber
            echo "Beta channel now offers $VERSION (was: ${current:-none})."
          fi
