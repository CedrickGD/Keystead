# Pin the toolchain so new clippy lints in a later stable release don't break CI
# without a code change. Bump deliberately.
[toolchain]
channel = "1.97.0"
components = ["clippy", "rustfmt"]
# The Android targets of the phone app (emulator = x86_64, devices = aarch64).
targets = ["x86_64-pc-windows-msvc", "aarch64-linux-android", "x86_64-linux-android"]
