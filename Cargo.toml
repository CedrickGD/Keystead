[workspace]
resolver = "2"
members = [
    "crates/vaultx-core",
    "crates/vaultx-bridge",
    "crates/vaultx-tui",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license-file = "LICENSE"
repository = "https://github.com/CedrickGD/Vault-X"
authors = ["CedrickGD"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
