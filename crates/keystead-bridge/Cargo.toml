[package]
name = "keystead-bridge"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Keystead browser bridge: native messaging host, local socket IPC, protocol"

[dependencies]
keystead-core = { path = "../keystead-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
interprocess = "2.4.4"
sha2 = "0.11.0"
data-encoding = "2.11.1"
uuid = { version = "1.27.0", features = ["v4"] }
zeroize = "1.9.1"
dirs = "7.0.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
widestring = "1.2.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"
