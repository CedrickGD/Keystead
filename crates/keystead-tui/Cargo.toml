[package]
name = "keystead-tui"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Keystead terminal UI"

[[bin]]
name = "keystead-cli"
path = "src/main.rs"

[dependencies]
keystead-core = { path = "../keystead-core" }
# The crossterm backend is re-exported as `ratatui::crossterm`, so both always
# use the same crossterm version.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
clap = { version = "4.6.7", features = ["derive"] }
rpassword = "7.5.4"
# ShellExecuteW on Windows: no `cmd /c start` quoting pitfalls, no console flash.
open = { version = "5.4.4", features = ["shellexecute-on-windows"] }
zeroize = "1.9.1"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
