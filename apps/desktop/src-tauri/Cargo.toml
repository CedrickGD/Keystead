[package]
name = "keystead-desktop"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Keystead desktop app"

# One crate for the desktop and the phone (see "Executable modes" in
# docs/ARCHITECTURE.md): the library carries the whole app; the desktop
# binary adds the native-host / terminal dispatch, the phone loads the
# library (`cdylib` on Android, `staticlib` on iOS). The name differs from
# the binary's on purpose (Cargo cannot build both under one name).
[lib]
name = "keystead_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "Keystead"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keystead-core = { path = "../../../crates/keystead-core" }
# Without features here; the desktop table below adds the tray icon.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Wipes secrets in values handed to the UI and a copied secret kept for
# clear-on-lock.
zeroize = "1.9.1"
# Ids of the user's generator presets (`src/generator.rs`, both
# platforms); the version the core already uses.
uuid = { version = "1.27.0", features = ["v4"] }
# Server sync (stage 2c, `src/remote/`, both platforms): an own thin WebDAV
# client. reqwest without its defaults: rustls with ring (the crypto
# provider installed as the process default, as the updater does), HTTP/1.1
# only; the desktop table below adds the system proxy. The client is the
# async one, driven on a small runtime of the WebDAV client's own
# (`remote::webdav`): only it has a read timeout without a total one.
# Its TLS configuration is always built by `remote::tls` (desktop: the
# platform verifier; Android: the webpki roots, so the platform verifier –
# which would need JNI set-up there – is never used).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
http = "1"
# The WebDAV client's runtime (reqwest's own; listed for the features used).
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
# PROPFIND answers (no DTDs, see `remote::dav_xml`); the version the lock
# already has.
quick-xml = "0.42.0"
# Paths in WebDAV URLs and hrefs.
percent-encoding = "2.3.2"
# The mirror's version token of a folder copy and the pinned certificate's
# fingerprint; the version the core already uses.
sha2 = "0.11.0"

# Desktop only (Windows, Linux, macOS): everything the phone has no use for –
# browser bridge, terminal UI, tray, single instance, updater, the website
# icon fetcher and the leaked-password check (the phone's only network use
# is the server sync, whose client `remote::tls` builds; no other reqwest
# client on the phone – its rustls platform verifier would need JNI set-up
# there).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keystead-bridge = { path = "../../../crates/keystead-bridge" }
keystead-tui = { path = "../../../crates/keystead-tui" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
# In-app updates: signed (minisign) NSIS setup / AppImage from GitHub
# releases, see "In-app updates" in docs/ARCHITECTURE.md. No `zip` feature:
# the update is the signed setup.exe itself, not an archive.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2"
# To learn the HTTP status of `latest.json` when the updater reports "no
# release" (it drops the status), and for the website-icon fetcher
# (`src/icons/fetch.rs`, no proxy, own DNS check): same versions and
# features as the plugin's, so nothing extra is compiled.
# `rustls-no-provider` → ring is installed as the process default first (as
# the plugin does).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
# The server sync's certificate check on the desktop (`remote::tls`): the
# system's trust store, as reqwest itself uses it.
rustls-platform-verifier = "0.7.1"
# The icon fetcher reads the system/environment proxy settings with the same
# matcher reqwest uses (`system-proxy` above) – to skip sites a proxy would
# handle instead of going around it. Already compiled for reqwest.
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy", "client-proxy-system"] }
# Website icons: decoders for what sites serve as favicons (no SVG); resized
# to 64×64 and stored as PNG. `png` is already compiled for Tauri.
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp"] }
# The icon fetcher's DNS lookup, parallel downloads and per-site deadline
# (tokio is Tauri's runtime; listed for the features used directly).
tokio = { version = "1", default-features = false, features = ["rt", "net", "sync", "time"] }
semver = "1"
time = { version = "0.3", features = ["formatting"] }
# Opens websites and the data folder with the system handler (ShellExecuteW
# on Windows: no `cmd /c start` quoting pitfalls, no console flash).
open = { version = "5.4.4", features = ["shellexecute-on-windows"] }
raw-window-handle = "0.6.2"
# Wipes secrets in values handed to the UI and a copied secret kept for
# clear-on-lock.
zeroize = "1.9.1"

# Phone only (Android, iOS): the official plugins the Rust side calls (the
# webview gets no permission for them, see `capabilities/default.json`).
# Not for the desktop – there the opener would add zbus/windows crates for
# nothing, and the clipboard plugin's own arboard features would change the
# core's arboard build on Linux.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# The phone's clipboard (`src/mobile.rs`): `write_secret` marks a copied
# secret as sensitive (Android 13+ hides it from the clipboard preview).
tauri-plugin-clipboard-manager = "2"
# Opens links in the phone's browser (`platform::open_url`).
tauri-plugin-opener = "2"

# Android only: fingerprint unlock (`src/mobile/biometric.rs`). Its Rust API
# `biometric_cipher` encrypts / decrypts with an AES-GCM key in the Android
# Keystore that only a strong biometric (BiometricPrompt with a
# CryptoObject) releases – the vault's master KEK is stored wrapped by it.
# (Its iOS side has no cipher, only pass/fail: not used there.)
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-biometric = "2.5"
# The server sync's trust anchors on the phone (`remote::tls`): Mozilla's
# root store, compiled in – no JNI set-up for the platform verifier.
webpki-roots = "1.0.9"

[target.'cfg(target_os = "linux")'.dependencies]
# Probe for the AppIndicator library before creating the tray icon.
libloading = "0.7"

[target.'cfg(windows)'.dependencies]
# Reads the installer's uninstall entry (installed vs. portable copy).
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"
# Certificates of the in-process WebDAV test server (`remote::test_server`).
rcgen = "0.14.10"
